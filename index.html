<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>阿茲塔瑞記憶遊戲助手</title>
  <style>
    :root { color-scheme: dark; --ink:#edf7db; --muted:#9bb590; --card:#101a10; --edge:#355638; --accent:#9af15b; --gold:#e2c975; --danger:#d35a4c; --shadow:#020702; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:system-ui,"Microsoft YaHei",sans-serif; color:var(--ink); background:radial-gradient(ellipse at 18% 0,#264d26 0,transparent 45%),radial-gradient(ellipse at 84% 100%,#142d1a 0,transparent 48%),linear-gradient(145deg,#050a06,#0a110b 55%,#030603); }
    .app-layout { width:min(1040px,100%); display:grid; grid-template-columns:minmax(0,620px) minmax(260px,340px); align-items:center; justify-content:center; gap:22px; } main { width:100%; position:relative; overflow:hidden; background:linear-gradient(145deg,color-mix(in srgb,var(--card) 96%,#274226),var(--card)); border:1px solid var(--edge); border-radius:8px 22px 8px 22px; padding:clamp(24px,5vw,44px); box-shadow:0 0 0 1px #0009 inset,0 0 34px #79d45422,0 26px 70px var(--shadow); }
    main::before { content:""; position:absolute; inset:7px; border:1px solid #8ab25b26; border-radius:4px 17px 4px 17px; pointer-events:none; }
    .eyebrow { position:relative; margin:0 0 4px; color:var(--gold); font-size:.9rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; } .eyebrow span { margin-left:.7em; color:#c8ffc0; text-shadow:0 0 10px #9af15b55; } h1 { position:relative; margin:0 0 14px; font-size:clamp(1.7rem,5vw,2.5rem); text-shadow:0 0 18px #9af15b33; } p { color:var(--muted); line-height:1.65; } .instructions { position:relative; color:var(--muted); line-height:1.6; } .instructions strong { color:var(--gold); } .instructions ol { margin:7px 0 20px; padding-left:1.45em; }
    .status { position:relative; display:flex; align-items:center; gap:12px; margin:28px 0; padding:16px; border:1px solid var(--edge); border-radius:5px 13px 5px 13px; background:#06100899; box-shadow:inset 0 0 18px #67b84b0d; font-weight:650; }
    .dot { width:13px; height:13px; border-radius:50%; background:#657d64; flex:none; }.listening .dot { background:var(--accent); box-shadow:0 0 0 7px #9af15b1c,0 0 15px #9af15baa; }.recording .dot { background:var(--danger); animation:pulse 1.1s infinite; } @keyframes pulse { 50%{box-shadow:0 0 0 10px #d35a4c20,0 0 15px #d35a4c;} }
    .buttons { position:relative; display:flex; flex-wrap:wrap; gap:12px; } button { border:1px solid #bce77788; border-radius:4px 10px 4px 10px; padding:12px 17px; font:inherit; font-weight:800; cursor:pointer; color:#0a1908; background:linear-gradient(135deg,#b9f176,#79c94a); box-shadow:0 4px 14px #69ce4033; }.stop { border-color:#f0917b77; color:#fff7e9; background:linear-gradient(135deg,#c85a4b,#82362e); box-shadow:none; } button:disabled { opacity:.5; cursor:not-allowed; } .mobile-note { position:relative; margin:11px 0 0; color:#ff897d; font-size:.82rem; line-height:1.5; }
    .heard { position:relative; min-height:5.3em; display:grid; place-items:center; margin:20px 0 0; padding:18px; border:1px solid #25462a; border-radius:5px 13px 5px 13px; background:radial-gradient(ellipse at center,#18331b,#071008); color:var(--ink); box-shadow:inset 0 0 28px #000a; font-size:clamp(1.5rem,5.5vw,2.8rem); font-weight:800; line-height:1.35; text-align:center; word-break:break-word; } .sequence-label { color:var(--accent); margin-right:.35em; text-shadow:0 0 12px #9af15b77; } audio { position:relative; width:100%; margin-top:22px; accent-color:var(--accent); } .author { position:relative; display:flex; align-items:center; justify-content:center; gap:7px; margin:24px 0 0; color:var(--muted); font-size:.86rem; } .author a { display:flex; align-items:center; gap:7px; color:var(--gold); font-weight:700; text-decoration:none; } .author a:hover { color:var(--accent); text-decoration:underline; } .author-avatar { width:26px; height:26px; border:1px solid var(--gold); border-radius:50%; object-fit:cover; box-shadow:0 0 10px #e2c97555; }
    .example-card { padding:11px; border:1px solid var(--gold); border-radius:5px 14px 5px 14px; background:linear-gradient(145deg,#172014,#0b110a); box-shadow:0 0 22px #e2c97522,inset 0 0 16px #0009; } .example-card img { display:block; width:100%; border:1px solid #e2c97577; border-radius:3px 9px 3px 9px; } .example-card p { margin:11px 4px 3px; color:#bfeaff; font-size:.86rem; line-height:1.55; text-align:center; } @media (max-width:820px) { body { padding:16px; } .app-layout { grid-template-columns:1fr; max-width:620px; } .example-card { width:min(340px,100%); justify-self:center; } }
  </style>
</head>
<body>
  <div class="app-layout">
  <main>
    <p class="eyebrow">12.1 雙問號挑戰<span>WHAT DOES THE SNAKE SAY</span></p>
    <h1>阿茲塔瑞 記憶遊戲助手</h1>
    <div class="instructions">
      <strong>使用方法：</strong>
      <ol>
        <li>戰鬥開始前，點擊「開始監聽」，並給予麥克風權限</li>
        <li>戰鬥進入記憶遊戲階段時，請說「開始」，隨後唸出光柱顏色順序</li>
        <li>當停止說話 3 秒後，系統會自動重複剛才唸出的內容</li>
      </ol>
    </div>
    <div id="status" class="status"><i class="dot"></i><span id="statusText">尚未开启监听</span></div>
    <div class="buttons">
      <button id="listenBtn">開始監聽</button>
      <button id="stopBtn" class="stop" disabled>停止監聽</button>
    </div>
    <p class="mobile-note">由於技術限制，手機端無法自動播放語音，推薦在電腦端使用</p>
    <div id="heard" class="heard" aria-live="polite">唸出的內容會顯示在這裡</div>
    <audio id="player" controls hidden></audio>
    <p class="author"><span>作者：</span><a href="https://space.bilibili.com/367050" target="_blank" rel="noopener noreferrer"><img class="author-avatar" src="images/author.jpg" alt="神聖小喵頭像" />神聖小喵</a></p>
  </main>
  <aside class="example-card">
    <img src="images/example.jpg" alt="光柱擺放範例" />
    <p>戰鬥開始前請如圖所示放好光柱，對應不同的顏色</p>
  </aside>
  </div>
  <script>
    (() => {
      const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const $ = id => document.getElementById(id);
      const status = $('status'), statusText = $('statusText'), heard = $('heard');
      const listenBtn = $('listenBtn'), stopBtn = $('stopBtn');
      const player = $('player');
      let stream, recorder, recognition, chunks = [], recording = false, shouldListen = false, audioUrl;
      let playingSavedAudio = false;
      let audioContext, analyser, samples, silenceStartedAt = 0, silenceFrame;
      const SILENCE_LIMIT_MS = 3000;
      const SOUND_THRESHOLD = 0.015; // 可按实际麦克风灵敏度微调（0 到 1）

      const setStatus = (text, mode = '') => { status.className = `status ${mode}`; statusText.textContent = text; };
      const isStart = text => /(開始|开始)/.test(text);
      const isStop = text => /(停止|結束|结束|停一下|停)/.test(text);
      function showSequence(text) {
        const sequence = text.split(/開始|开始/).pop().replace(/(?:停止|結束|结束|停一下|停)\s*$/, '').trim();
        const label = document.createElement('span');
        label.className = 'sequence-label';
        label.textContent = '本輪順序：';
        heard.replaceChildren(label, document.createTextNode(sequence || '等待唸出順序…'));
      }

      async function getStream() {
        if (!stream) stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        return stream;
      }
      function saveRecording() {
        const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
        player.pause();
        if (audioUrl) URL.revokeObjectURL(audioUrl);
        audioUrl = URL.createObjectURL(blob);
        player.src = audioUrl;
        player.currentTime = 0;
        player.load();
        player.hidden = false;
        playingSavedAudio = true;
        if (recognition) recognition.abort();
        setStatus('錄音完成，正在準備播放');
        const playLatest = () => {
          if (player.src !== audioUrl) return;
          player.currentTime = 0;
          player.play().catch(() => {
            playingSavedAudio = false;
            if (shouldListen) setStatus('錄音已完成，請點擊播放器播放', 'listening');
          });
        };
        if (player.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) playLatest();
        else player.addEventListener('canplay', playLatest, { once: true });
      }
      function stopRecording() {
        if (!recording) return;
        recording = false;
        cancelAnimationFrame(silenceFrame);
        silenceStartedAt = 0;
        if (recorder.state !== 'inactive') recorder.stop();
        stopBtn.disabled = true;
        setStatus('录音已停止，正在生成音频…');
      }
      function monitorSilence() {
        if (!recording) return;
        analyser.getByteTimeDomainData(samples);
        let sum = 0;
        for (const value of samples) {
          const level = (value - 128) / 128;
          sum += level * level;
        }
        const volume = Math.sqrt(sum / samples.length);
        const now = performance.now();
        if (volume >= SOUND_THRESHOLD) {
          silenceStartedAt = 0;
        } else if (!silenceStartedAt) {
          silenceStartedAt = now;
        } else if (now - silenceStartedAt >= SILENCE_LIMIT_MS) {
          stopRecording();
          return;
        }
        silenceFrame = requestAnimationFrame(monitorSilence);
      }
      function startRecording() {
        if (recording) return;
        chunks = [];
        recorder = new MediaRecorder(stream, MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? { mimeType: 'audio/webm;codecs=opus' } : undefined);
        recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
        recorder.onstop = saveRecording;
        recorder.start(); recording = true; stopBtn.disabled = false;
        silenceStartedAt = performance.now();
        monitorSilence();
        setStatus('正在录音… 静音 3 秒后自动结束', 'recording');
      }
      function beginRecognition() {
        if (!Recognition) { setStatus('此浏览器不支持语音识别，请使用 Chrome 或 Edge'); return; }
        recognition = new Recognition();
        recognition.lang = 'zh-TW'; recognition.continuous = true; recognition.interimResults = true;
        recognition.onresult = event => {
          let text = '', freshText = '';
          for (let i = 0; i < event.results.length; i++) text += event.results[i][0].transcript;
          for (let i = event.resultIndex; i < event.results.length; i++) freshText += event.results[i][0].transcript;
          if (!recording && isStart(freshText)) {
            startRecording();
            showSequence(text);
          } else if (recording) {
            showSequence(text);
            if (isStop(freshText)) stopRecording();
          }
        };
        recognition.onerror = e => {
          if (e.error === 'no-speech' || e.error === 'aborted') return;
          setStatus(`语音识别出错：${e.error}`);
        };
        recognition.onend = () => { if (shouldListen && !playingSavedAudio) { try { recognition.start(); } catch (_) {} } };
        recognition.start();
      }
      function resumeListeningAfterPlayback() {
        if (!playingSavedAudio) return;
        playingSavedAudio = false;
        if (shouldListen) {
          setStatus('正在监听，请说“开始”', 'listening');
          try { recognition.start(); } catch (_) {}
        }
      }
      async function enable() {
        try {
          await getStream();
          if (!audioContext) {
            audioContext = new AudioContext();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser(); analyser.fftSize = 2048;
            samples = new Uint8Array(analyser.fftSize); source.connect(analyser);
          }
          if (audioContext.state === 'suspended') await audioContext.resume();
          shouldListen = true; listenBtn.disabled = true;
          setStatus('正在监听，请说“开始”', 'listening'); beginRecognition();
        } catch (error) { setStatus(`无法使用麦克风：${error.message}`); }
      }
      listenBtn.addEventListener('click', enable); stopBtn.addEventListener('click', stopRecording);
      player.addEventListener('play', () => {
        playingSavedAudio = true;
        if (recognition) recognition.abort();
        setStatus('正在播放录音，播放结束后自动恢复监听');
      });
      player.addEventListener('pause', resumeListeningAfterPlayback);
      player.addEventListener('ended', resumeListeningAfterPlayback);
      window.addEventListener('beforeunload', () => { cancelAnimationFrame(silenceFrame); if (audioContext) audioContext.close(); if (stream) stream.getTracks().forEach(track => track.stop()); if (audioUrl) URL.revokeObjectURL(audioUrl); });
    })();
  </script>
</body>
</html>
